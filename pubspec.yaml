name: lumina
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  mobile_scanner: ^7.1.0
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.5.0
  google_generative_ai: ^0.4.6
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  image_picker: ^1.1.2
  http: ^1.2.2
  device_preview: ^1.1.0
  intl: ^0.20.2
  local_auth: ^2.3.0
  health: ^13.3.1
  sentry_flutter: 9.26.0
  home_widget: ^0.9.3
  url_launcher: ^6.3.0
  flutter_3d_controller: ^2.3.0
  package_info_plus: ^9.0.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Welmi.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/Welmi.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/3d_models/
