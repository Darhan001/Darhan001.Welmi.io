name: lumina
description: "Welmi — питание, вода, активность, вес и тренировки."
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.1.0
  mobile_scanner: ^7.1.0
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.5.0
  google_generative_ai: ^0.4.6
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0
  image_picker: ^1.1.2
  http: ^1.2.2
  device_preview: ^1.1.0
  intl: ^0.20.2
  local_auth: ^2.3.0
  health: ^13.3.1
  sentry_flutter: 9.26.0
  home_widget: ^0.9.3
  url_launcher: ^6.3.0
  flutter_3d_controller: ^2.3.0
  package_info_plus: ^9.0.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  record: ^7.1.1
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.3
  fl_chart: ^0.68.0
  flutter_tts: ^4.2.5
  speech_to_text: ^7.5.0
  local_auth_android: ^1.0.56
  local_auth_darwin: ^1.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/WELMI.png"
  min_sdk_android: 21
  adaptive_icon_background: "#06130F"
  adaptive_icon_foreground: "assets/images/WELMI.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    # Только фото рецептов. Папка assets/images/ целиком сюда не входит:
    # в ней лежат исходники иконки (WELMI.png, images.png, 2,7 МБ), которые
    # нужны генератору иконок при разработке, но не самому приложению.
    - assets/images/recipes/
    # Шрифт Inter (SIL OFL 1.1, github.com/rsms/inter v4.1). Пакет google_fonts
    # берёт файлы отсюда и не скачивает шрифт из сети при первом запуске.
    - assets/google_fonts/
    - assets/3d_models/
